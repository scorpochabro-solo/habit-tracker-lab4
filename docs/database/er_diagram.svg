<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">ER-диаграмма трекера полезных привычек</title>
<desc id="desc">Таблица habits связана один ко многим с completions. Составной первичный ключ completions — habit_id и completion_date. Удаление привычки удаляет её отметки.</desc>
<rect width="1600" height="850" fill="#f5f7fb"/><rect width="1600" height="14" fill="#1959d1"/>
<g font-family="Arial, sans-serif"><text x="90" y="92" font-size="19" fill="#59657a" font-weight="bold">ЛАБОРАТОРНАЯ РАБОТА № 4</text><text x="90" y="150" font-size="45" fill="#17213b" font-weight="bold">Модель данных · трекер привычек</text><text x="90" y="192" font-size="22" fill="#59657a">MVP · SQLite · нормализация до 3NF</text>
<rect x="90" y="265" width="530" height="348" rx="14" fill="#fff" stroke="#d8e1f0" stroke-width="2"/><rect x="90" y="265" width="530" height="78" rx="14" fill="#1959d1"/><rect x="90" y="322" width="530" height="21" fill="#1959d1"/><text x="125" y="315" font-size="30" font-weight="bold" fill="#fff">HABITS</text>
<g font-size="23" fill="#17213b"><text x="125" y="399">habit_id</text><text x="125" y="452">title</text><text x="125" y="505">description</text><text x="125" y="558">created_date</text></g><g font-size="20" fill="#59657a"><text x="390" y="399">TEXT · PK</text><text x="390" y="452">TEXT · NOT NULL</text><text x="390" y="505">TEXT · NULL</text><text x="390" y="558">TEXT · NOT NULL</text></g>
<rect x="980" y="265" width="530" height="348" rx="14" fill="#fff" stroke="#d8e1f0" stroke-width="2"/><rect x="980" y="265" width="530" height="78" rx="14" fill="#128177"/><rect x="980" y="322" width="530" height="21" fill="#128177"/><text x="1015" y="315" font-size="30" font-weight="bold" fill="#fff">COMPLETIONS</text>
<g font-size="23" fill="#17213b"><text x="1015" y="399">habit_id</text><text x="1015" y="452">completion_date</text></g><g font-size="20" fill="#59657a"><text x="1290" y="399">TEXT · PK, FK</text><text x="1290" y="452">TEXT · PK</text></g><text x="1015" y="533" font-size="19" fill="#59657a">Одна отметка на привычку и дату</text>
<path d="M620 425 H980 M650 406 V444 M950 425 L975 405 M950 425 L975 445" stroke="#17213b" stroke-width="4" fill="none"/><text x="700" y="395" font-size="22" font-weight="bold" fill="#17213b">1</text><text x="870" y="395" font-size="22" font-weight="bold" fill="#17213b">0..N</text><text x="643" y="474" font-size="18" fill="#59657a">принадлежит</text>
<text x="90" y="705" font-size="21" fill="#17213b">PK — первичный ключ · FK — внешний ключ · удаление привычки удаляет её отметки</text><text x="90" y="749" font-size="19" fill="#59657a">Локальное «сегодня» и запрет будущих дат проверяются приложением.</text><text x="90" y="800" font-size="18" fill="#59657a">Лазарев Александр Евгеньевич · ОИСТ-412</text></g></svg>
